{% extends "base.html" %}

{% block header_nav %}
<div class="site-nav-shell">
    <button
        type="button"
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="site-nav"
        aria-label="Open navigation menu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav class="site-nav" id="site-nav">
        <a href="{% url 'dashboard:home' %}">Dashboard</a>
        <a href="{% url 'dashboard:facility_list' %}">Facilities</a>
        <a href="{% url 'dashboard:feedback_list' %}">Submissions</a>
        <a href="{% url 'dashboard:bulk_session_list' %}">Collection sessions</a>
        {% if request.user.is_staff %}
            <a href="{% url 'dashboard:user_list' %}">Users</a>
        {% endif %}
        <a href="{% url 'dashboard:account' %}">My account</a>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="link-button">Sign out</button>
        </form>
    </nav>
</div>
{% endblock %}
